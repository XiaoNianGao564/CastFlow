<svg viewBox="0 0 760 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CastFlow self-iterating code patching loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#3FB950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="540" rx="16" fill="#0D1117"/>

  <!-- Step 1: Generate Python Code -->
  <rect x="260" y="28" width="240" height="48" rx="10" fill="#0C2D48" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="380" y="48" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#93C5FD">Generate Python Code</text>
  <text x="380" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">LLM writes prediction script</text>

  <!-- Arrow -->
  <line x1="380" y1="76" x2="380" y2="104" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 2: Execute & Collect -->
  <rect x="260" y="104" width="240" height="48" rx="10" fill="#052E16" stroke="#22C55E" stroke-width="1.5"/>
  <text x="380" y="124" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#86EFAC">Execute &amp; Collect Results</text>
  <text x="380" y="142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4ADE80">Sandboxed Python subprocess</text>

  <!-- Arrow -->
  <line x1="380" y1="152" x2="380" y2="180" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 3: Wait for Real Data -->
  <rect x="260" y="180" width="240" height="48" rx="10" fill="#2D1B00" stroke="#EAB308" stroke-width="1.5"/>
  <text x="380" y="200" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDE047">Wait for Real Data</text>
  <text x="380" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#FACC15">Polls MySQL periodically</text>

  <!-- Arrow -->
  <line x1="380" y1="228" x2="380" y2="256" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 4: Calculate Accuracy -->
  <rect x="260" y="256" width="240" height="48" rx="10" fill="#2D1B0E" stroke="#F97316" stroke-width="1.5"/>
  <text x="380" y="276" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDBA74">Calculate Accuracy</text>
  <text x="380" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#FB923C">MAPE / MAE / RMSE</text>

  <!-- Arrow to diamond -->
  <line x1="380" y1="304" x2="380" y2="332" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- Decision Diamond -->
  <polygon points="380,332 470,376 380,420 290,376" fill="#161B22" stroke="#8B949E" stroke-width="1.5"/>
  <text x="380" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#C9D1D9">Accuracy</text>
  <text x="380" y="388" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#C9D1D9">Improved?</text>

  <!-- ===== YES branch (left) ===== -->
  <line x1="290" y1="376" x2="200" y2="376" stroke="#3FB950" stroke-width="1.5" marker-end="url(#ay)"/>
  <rect x="284" y="358" width="36" height="16" rx="3" fill="#052E16"/>
  <text x="302" y="366" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3FB950">YES</text>

  <!-- Save as new best -->
  <rect x="36" y="352" width="164" height="48" rx="10" fill="#052E16" stroke="#22C55E" stroke-width="1.5"/>
  <text x="118" y="372" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#86EFAC">Save as new best</text>
  <text x="118" y="390" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" fill="#4ADE80">Update baseline</text>

  <!-- ===== NO branch (right) ===== -->
  <line x1="470" y1="376" x2="560" y2="376" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="472" y="358" width="28" height="16" rx="3" fill="#3B0A1E"/>
  <text x="486" y="366" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#F43F5E">NO</text>

  <!-- Analyze errors -->
  <rect x="560" y="352" width="164" height="48" rx="10" fill="#3B0A1E" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="642" y="372" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDA4AF">Analyze Errors</text>
  <text x="642" y="390" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" fill="#F87171">LLM root-cause reasoning</text>

  <!-- Arrow from analyze down -->
  <line x1="642" y1="400" x2="642" y2="430" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- Generate Minimal Patch -->
  <rect x="510" y="430" width="264" height="52" rx="10" fill="#1F1B4B" stroke="#7C6AE8" stroke-width="1.5"/>
  <text x="642" y="452" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#C4B5FD">Generate Minimal Patch</text>
  <text x="642" y="470" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#A78BFA">params / preprocessing / model logic</text>

  <!-- ===== Loop-back arrow ===== -->
  <path d="M510 456 L200 456 L200 128 L260 128" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="8 5" marker-end="url(#al)"/>
  <!-- Loop label -->
  <rect x="172" y="275" width="56" height="60" rx="6" fill="#0D1117"/>
  <text x="200" y="297" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#3B82F6">LOOP</text>
  <text x="200" y="312" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#3B82F6">BACK</text>

  <!-- Rollback note -->
  <text x="118" y="416" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#484F58">Non-improving iterations</text>
  <text x="118" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#484F58">always rollback to best</text>

  <!-- Footer -->
  <text x="380" y="516" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#484F58">Self-iterating code patching — minimal diffs, no full rewrites</text>
</svg>