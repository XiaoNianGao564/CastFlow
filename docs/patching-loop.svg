<svg viewBox="0 0 680 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CastFlow self-iterating code patching loop</title>
  <desc>Generate Python code, execute it, wait for real data from MySQL, calculate accuracy metrics (MAPE/MAE/RMSE), then branch: if accuracy improved, save as new best; if not, analyze errors with LLM reasoning, generate a minimal patch, and repeat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t{font-family:var(--font-sans,sans-serif);font-size:14px;fill:#2C2C2A}
    .ts{font-family:var(--font-sans,sans-serif);font-size:12px;fill:#5F5E5A}
    .th{font-family:var(--font-sans,sans-serif);font-size:14px;font-weight:500;fill:#2C2C2A}
  </style>

  <!-- Step 1: Generate Python Code -->
  <rect x="220" y="20" width="240" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Generate Python Code</text>

  <!-- Arrow down -->
  <line x1="340" y1="64" x2="340" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: Execute & Collect Results -->
  <rect x="220" y="90" width="240" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="340" y="112" text-anchor="middle" dominant-baseline="central" fill="#27500A">Execute &amp; Collect Results</text>

  <!-- Arrow down -->
  <line x1="340" y1="134" x2="340" y2="160" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Wait for Real Data -->
  <rect x="220" y="160" width="240" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central" fill="#633806">Wait for Real Data (polls MySQL)</text>

  <!-- Arrow down -->
  <line x1="340" y1="204" x2="340" y2="230" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 4: Calculate Accuracy -->
  <rect x="220" y="230" width="240" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central" fill="#712B13">Calculate Accuracy (MAPE/MAE/RMSE)</text>

  <!-- Arrow down to diamond -->
  <line x1="340" y1="274" x2="340" y2="300" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Decision Diamond -->
  <polygon points="340,300 430,340 340,380 250,340" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Accuracy</text>
  <text class="th" x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Improved?</text>

  <!-- YES branch (left) -->
  <line x1="250" y1="340" x2="170" y2="340" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="210" y="332" text-anchor="middle" fill="#3B6D11" font-weight="500">YES</text>

  <!-- Save as new best -->
  <rect x="30" y="318" width="140" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="100" y="340" text-anchor="middle" dominant-baseline="central" fill="#173404">Save as new best</text>

  <!-- NO branch (right) -->
  <line x1="430" y1="340" x2="510" y2="340" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="470" y="332" text-anchor="middle" fill="#993C1D" font-weight="500">NO</text>

  <!-- Analyze errors -->
  <rect x="510" y="318" width="140" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="580" y="335" text-anchor="middle" dominant-baseline="central" fill="#712B13">Analyze errors</text>
  <text class="ts" x="580" y="351" text-anchor="middle" dominant-baseline="central" fill="#993C1D">(LLM reasoning)</text>

  <!-- Arrow from analyze down to generate patch -->
  <line x1="580" y1="362" x2="580" y2="390" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Generate Patch -->
  <rect x="470" y="390" width="220" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text class="th" x="580" y="408" text-anchor="middle" dominant-baseline="central" fill="#72243E">Generate Minimal Patch</text>
  <text class="ts" x="580" y="424" text-anchor="middle" dominant-baseline="central" fill="#993556">params / preprocessing / model logic</text>

  <!-- Loop-back arrow: from Generate Patch back up to Execute -->
  <path d="M470 412 L180 412 L180 112 L220 112" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts" x="185" y="270" text-anchor="middle" fill="#888780" transform="rotate(-90, 185, 270)">repeat (up to N iterations)</text>

  <!-- Rollback note on save-as-best -->
  <text class="ts" x="100" y="375" text-anchor="middle" fill="#5F5E5A">Non-improving iterations</text>
  <text class="ts" x="100" y="390" text-anchor="middle" fill="#5F5E5A">always rollback to best</text>

  <!-- Title -->
  <text class="t" x="340" y="448" text-anchor="middle" fill="#888780" font-style="italic">Self-iterating code patching — minimal diffs, no full rewrites</text>

</svg>