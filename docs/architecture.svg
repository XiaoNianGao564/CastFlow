<svg viewBox="0 0 760 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CastFlow multi-agent architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#3FB950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="520" rx="16" fill="#0D1117"/>

  <!-- ===== TIER 0: CoordinatorAgent ===== -->
  <rect x="248" y="24" width="264" height="48" rx="10" fill="#1F1B4B" stroke="#7C6AE8" stroke-width="1.5"/>
  <text x="380" y="48" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#C4B5FD">CoordinatorAgent</text>
  <text x="380" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8B949E">Master orchestrator</text>

  <!-- Arrows from Coordinator -->
  <line x1="310" y1="72" x2="155" y2="120" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>
  <line x1="450" y1="72" x2="600" y2="120" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- ===== TIER 1: Planning Agents ===== -->
  <!-- PlannerAgent -->
  <rect x="48" y="120" width="210" height="52" rx="10" fill="#0C2D48" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="153" y="142" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#93C5FD">PlannerAgent</text>
  <text x="153" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#64748B">Data diagnosis / model selection</text>

  <!-- ReActPlanner -->
  <rect x="502" y="120" width="210" height="52" rx="10" fill="#2D1B0E" stroke="#F97316" stroke-width="1.2"/>
  <text x="607" y="142" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDBA74">ReActPlanner</text>
  <text x="607" y="160" text-anchor="middle" dominant-baseline="system-ui,sans-serif" font-size="10.5" fill="#64748B">11 ReAct tools dispatch</text>

  <!-- Middle badge -->
  <rect x="296" y="104" width="168" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="380" y="118" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#8B949E">orchestrates</text>

  <!-- Arrow down from badge -->
  <line x1="380" y1="132" x2="380" y2="196" stroke="#30363D" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== Divider ===== -->
  <line x1="40" y1="196" x2="720" y2="196" stroke="#21262D" stroke-width="1.5"/>
  <text x="380" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#484F58">CORE EXECUTION PIPELINE</text>

  <!-- ===== TIER 2: 5 Core Agents ===== -->
  <!-- DataAgent -->
  <rect x="32" y="214" width="120" height="52" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
  <text x="92" y="235" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#86EFAC">DataAgent</text>
  <text x="92" y="252" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="9.5" fill="#4ADE80">MySQL + checks</text>

  <!-- CodeGenAgent -->
  <rect x="168" y="214" width="120" height="52" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
  <text x="228" y="235" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#86EFAC">CodeGen</text>
  <text x="228" y="252" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="9.5" fill="#4ADE80">Python gen</text>

  <!-- ExecutionAgent -->
  <rect x="304" y="214" width="120" height="52" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
  <text x="364" y="235" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#86EFAC">Execution</text>
  <text x="364" y="252" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="9.5" fill="#4ADE80">Sandboxed runner</text>

  <!-- EvaluationAgent -->
  <rect x="440" y="214" width="120" height="52" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
  <text x="500" y="235" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#86EFAC">Evaluation</text>
  <text x="500" y="252" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="9.5" fill="#4ADE80">MAPE/MAE/RMSE</text>

  <!-- AnalysisAgent -->
  <rect x="576" y="214" width="120" height="52" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
  <text x="636" y="235" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#86EFAC">Analysis</text>
  <text x="636" y="252" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="9.5" fill="#4ADE80">LLM error analysis</text>

  <!-- Connecting arrows between core agents -->
  <line x1="152" y1="240" x2="168" y2="240" stroke="#22C55E" stroke-width="0.8" marker-end="url(#ag)"/>
  <line x1="288" y1="240" x2="304" y2="240" stroke="#22C55E" stroke-width="0.8" marker-end="url(#ag)"/>
  <line x1="424" y1="240" x2="440" y2="240" stroke="#22C55E" stroke-width="0.8" marker-end="url(#ag)"/>
  <line x1="560" y1="240" x2="576" y2="240" stroke="#22C55E" stroke-width="0.8" marker-end="url(#ag)"/>

  <!-- Arrow from AnalysisAgent down to PatchAgent -->
  <line x1="636" y1="266" x2="636" y2="298" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- ===== TIER 3: Patch & Iterate ===== -->
  <!-- PatchAgent -->
  <rect x="520" y="298" width="220" height="52" rx="10" fill="#3B0A1E" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="630" y="320" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDA4AF">PatchAgent</text>
  <text x="630" y="338" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#F87171">LLM patches + fallback rules</text>

  <!-- Arrow Patch -> Forecaster -->
  <line x1="630" y1="350" x2="630" y2="382" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>

  <!-- ForecasterAgent -->
  <rect x="520" y="382" width="220" height="52" rx="10" fill="#2D1B00" stroke="#EAB308" stroke-width="1.2"/>
  <text x="630" y="404" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDE047">ForecasterAgent</text>
  <text x="630" y="422" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#FACC15">Iterative optimization loop</text>

  <!-- CriticAgent -->
  <rect x="100" y="382" width="220" height="52" rx="10" fill="#1F1B4B" stroke="#7C6AE8" stroke-width="1.2"/>
  <text x="210" y="404" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#C4B5FD">CriticAgent</text>
  <text x="210" y="422" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#A78BFA">Final review &amp; report</text>

  <!-- Arrow from Forecaster to Critic -->
  <line x1="520" y1="408" x2="320" y2="408" stroke="#8B949E" stroke-width="1" marker-end="url(#a)"/>
  <text x="420" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#484F58">final output</text>

  <!-- ===== ITERATION LOOP (left side) ===== -->
  <path d="M520 408 L24 408 L24 240 L32 240" fill="none" stroke="#3FB950" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <rect x="10" y="316" width="28" height="72" rx="4" fill="#0D1117"/>
  <text x="24" y="356" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" fill="#3FB950" writing-mode="tb">ITERATE</text>

  <!-- ===== Footer Stats ===== -->
  <rect x="240" y="470" width="280" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="380" y="485" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#C9D1D9">
    <tspan fill="#8B949E">11 agents</tspan>
    <tspan fill="#30363D"> | </tspan>
    <tspan fill="#8B949E">4 modes</tspan>
    <tspan fill="#30363D"> | </tspan>
    <tspan fill="#8B949E">31 models</tspan>
    <tspan fill="#30363D"> | </tspan>
    <tspan fill="#8B949E">3-layer memory</tspan>
  </text>
</svg>