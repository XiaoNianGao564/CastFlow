<svg viewBox="0 0 680 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CastFlow multi-agent architecture</title>
  <desc>CoordinatorAgent at top orchestrates PlannerAgent, ReActPlanner, and 5 core sub-agents (DataAgent, CodeGenAgent, ExecutionAgent, EvaluationAgent, AnalysisAgent), flowing down to PatchAgent, ForecasterAgent, and CriticAgent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t{font-family:var(--font-sans,sans-serif);font-size:14px;fill:#2C2C2A}
    .ts{font-family:var(--font-sans,sans-serif);font-size:12px;fill:#5F5E5A}
    .th{font-family:var(--font-sans,sans-serif);font-size:14px;font-weight:500;fill:#2C2C2A}
    .ths{font-family:var(--font-sans,sans-serif);font-size:12px;font-weight:500;fill:#5F5E5A}
  </style>

  <!-- CoordinatorAgent -->
  <rect x="235" y="20" width="210" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#3C3489">CoordinatorAgent</text>

  <!-- Arrows from Coordinator -->
  <line x1="280" y1="64" x2="160" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="64" x2="520" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="64" x2="340" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PlannerAgent -->
  <rect x="60" y="110" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="145" y="130" text-anchor="middle" dominant-baseline="central" fill="#0C447C">PlannerAgent</text>
  <text class="ts" x="145" y="148" text-anchor="middle" dominant-baseline="central">Data diagnosis &amp; model selection</text>

  <!-- ReActPlanner -->
  <rect x="440" y="110" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="525" y="130" text-anchor="middle" dominant-baseline="central" fill="#712B13">ReActPlanner</text>
  <text class="ts" x="525" y="148" text-anchor="middle" dominant-baseline="central">11 ReAct tools dispatch</text>

  <!-- Middle label -->
  <text class="ths" x="340" y="105" text-anchor="middle" fill="#888780">orchestrates</text>

  <!-- Horizontal bar (core agents row) -->
  <rect x="40" y="200" width="600" height="2" rx="1" fill="#D3D1C7"/>

  <!-- 5 Core Agents -->
  <!-- DataAgent -->
  <rect x="40" y="220" width="108" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="94" y="240" text-anchor="middle" dominant-baseline="central" fill="#27500A">DataAgent</text>
  <text class="ts" x="94" y="258" text-anchor="middle" dominant-baseline="central">MySQL + checks</text>

  <!-- CodeGenAgent -->
  <rect x="162" y="220" width="108" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="216" y="240" text-anchor="middle" dominant-baseline="central" fill="#27500A">CodeGen</text>
  <text class="ts" x="216" y="258" text-anchor="middle" dominant-baseline="central">Python generation</text>

  <!-- ExecutionAgent -->
  <rect x="284" y="220" width="108" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="338" y="240" text-anchor="middle" dominant-baseline="central" fill="#27500A">Execution</text>
  <text class="ts" x="338" y="258" text-anchor="middle" dominant-baseline="central">Sandboxed runner</text>

  <!-- EvaluationAgent -->
  <rect x="406" y="220" width="108" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="460" y="240" text-anchor="middle" dominant-baseline="central" fill="#27500A">Evaluation</text>
  <text class="ts" x="460" y="258" text-anchor="middle" dominant-baseline="central">MAPE / MAE / RMSE</text>

  <!-- AnalysisAgent -->
  <rect x="528" y="220" width="112" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="584" y="240" text-anchor="middle" dominant-baseline="central" fill="#27500A">Analysis</text>
  <text class="ts" x="584" y="258" text-anchor="middle" dominant-baseline="central">LLM error analysis</text>

  <!-- Arrows from AnalysisAgent down to PatchAgent -->
  <line x1="584" y1="276" x2="584" y2="310" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PatchAgent -->
  <rect x="492" y="310" width="170" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text class="th" x="577" y="330" text-anchor="middle" dominant-baseline="central" fill="#72243E">PatchAgent</text>
  <text class="ts" x="577" y="348" text-anchor="middle" dominant-baseline="central">LLM patches + fallback rules</text>

  <!-- Arrow Patch -> Forecaster -->
  <line x1="577" y1="366" x2="577" y2="400" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ForecasterAgent -->
  <rect x="492" y="400" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="577" y="420" text-anchor="middle" dominant-baseline="central" fill="#633806">ForecasterAgent</text>
  <text class="ts" x="577" y="438" text-anchor="middle" dominant-baseline="central">Iterative optimization loop</text>

  <!-- Arrow Forecaster -> Critic -->
  <line x1="577" y1="456" x2="577" y2="460" stroke="#888780" stroke-width="1"/>

  <!-- CriticAgent -->
  <rect x="80" y="400" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="165" y="420" text-anchor="middle" dominant-baseline="central" fill="#3C3489">CriticAgent</text>
  <text class="ts" x="165" y="438" text-anchor="middle" dominant-baseline="central">Final review &amp; report</text>

  <!-- Feedback loop arrow: Forecaster back to CodeGen -->
  <path d="M492 428 L40 428 L40 248 L40 248" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="40" y="340" text-anchor="middle" fill="#888780" transform="rotate(-90, 40, 340)">iteration loop</text>

  <!-- Arrow from Coordinator down to core agents -->
  <line x1="340" y1="110" x2="340" y2="118" stroke="#D3D1C7" stroke-width="1"/>
  <line x1="340" y1="118" x2="340" y2="200" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Stats badge -->
  <rect x="240" y="110" width="190" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="335" y="128" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">11 agents / 4 modes / 31 models</text>

</svg>