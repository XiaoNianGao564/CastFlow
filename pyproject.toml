[project]
name = "castflow"
version = "0.1.0"
description = "Self-iterating multi-agent forecasting system (LangGraph + Qwen)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "dashscope>=1.20.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "lightgbm",
    "pydantic>=2.0",
    "python-dotenv",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
full = [
    "chromadb>=0.5.0",
    "langfuse>=2.50.0",
    "deepeval>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.40.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["castflow"]
